# Local development only. For production deployment, see deploy/docker-compose.prod.yml
# Builds the repo's own Dockerfile, which auto-imports the 3 workflow JSONs on
# first start (see Dockerfile / docker/import-entrypoint.sh). Run with:
#   docker compose up --build
services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkedin-automation-n8n:local
    container_name: n8n-job-search
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:5678/
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - LOCATION_GEO_ID=${LOCATION_GEO_ID:-}
      - LOCATION_F_PP=${LOCATION_F_PP:-}
      - LOCATION_CITY_NAMES=${LOCATION_CITY_NAMES:-}
      - MAX_EXPERIENCE_YEARS=${MAX_EXPERIENCE_YEARS:-}
      - N8N_EXTERNAL_ALLOWED_ENVIRONMENT_VARIABLES=GEMINI_API_KEY,TELEGRAM_CHAT_ID,LOCATION_GEO_ID,LOCATION_F_PP,LOCATION_CITY_NAMES,MAX_EXPERIENCE_YEARS
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
    driver: local
