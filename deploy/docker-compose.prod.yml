services:
  n8n:
    # Pre-built image published by CI (see .github/workflows/deploy.yml), auto-imports
    # the 3 workflow JSONs on first start. Override DOCKER_IMAGE in deploy/.env if you've
    # forked this repo and publish under your own GHCR namespace.
    image: ${DOCKER_IMAGE:-ghcr.io/jatin17solanki/linkedin-automation-n8n:latest}
    container_name: n8n-job-search
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_SECURE_COOKIE=true
      - WEBHOOK_URL=https://${VM_IP}.nip.io/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=${VM_IP}.nip.io
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://${VM_IP}.nip.io/
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - LOCATION_GEO_ID=${LOCATION_GEO_ID:-102713980}
      - LOCATION_F_PP=${LOCATION_F_PP:-105214831}
      - LOCATION_CITY_NAMES=${LOCATION_CITY_NAMES:-bengaluru,bangalore,karnataka}
      - MAX_EXPERIENCE_YEARS=${MAX_EXPERIENCE_YEARS:-4}
      - N8N_EXTERNAL_ALLOWED_ENVIRONMENT_VARIABLES=GEMINI_API_KEY,TELEGRAM_CHAT_ID,LOCATION_GEO_ID,LOCATION_F_PP,LOCATION_CITY_NAMES,MAX_EXPERIENCE_YEARS
      - N8N_RUNNERS_ENABLED=false
      - NODE_OPTIONS=--max-old-space-size=512
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=72
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=500
    mem_limit: 600m
    memswap_limit: 800m
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - n8n-net

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VM_IP=${VM_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - n8n-net
    depends_on:
      - n8n

volumes:
  n8n_data:
    external: true
    name: n8n_n8n_data
  caddy_data:
    external: true
    name: n8n_caddy_data
  caddy_config:
    external: true
    name: n8n_caddy_config

networks:
  n8n-net:
    driver: bridge
