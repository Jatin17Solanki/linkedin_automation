name: Deploy Workflow to n8n

on:
  push:
    branches: [main]
    paths:
      - 'n8n_job_search_v1.json'
      - 'n8n_company_search_v1.json'
      - 'n8n_job_parser_v1.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload workflow files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "n8n_job_search_v1.json,n8n_company_search_v1.json,n8n_job_parser_v1.json,deploy/import-workflow.sh"
          target: "/tmp/n8n-deploy"
          overwrite: true

      - name: Import workflows via n8n API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /tmp/n8n-deploy
            chmod +x deploy/import-workflow.sh
            for f in n8n_job_search_v1.json n8n_company_search_v1.json n8n_job_parser_v1.json; do
              bash deploy/import-workflow.sh \
                "$f" \
                "https://${{ secrets.GCP_VM_IP }}.nip.io" \
                "${{ secrets.N8N_API_KEY }}"
            done
            rm -rf /tmp/n8n-deploy
